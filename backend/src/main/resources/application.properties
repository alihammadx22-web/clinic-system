spring.application.name=dental-clinic-backend

server.port=8080
server.servlet.context-path=/api

spring.datasource.url=${DENTAL_DB_URL}
spring.datasource.username=${DENTAL_DB_USERNAME}
spring.datasource.password=${DENTAL_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.cors.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}

app.jwt.secret=${JWT_SECRET}
app.jwt.expires-in-seconds=${JWT_EXPIRES_IN_SECONDS:86400}
